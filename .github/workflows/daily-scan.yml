name: Daily Rental Scan

on:
  schedule:
    - cron: '0 11 * * *'  # 14:00 Jerusalem (UTC+3 DST); adjust to '0 12 * * *' in winter (UTC+2)
  workflow_dispatch:       # allow manual trigger from GitHub UI

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Restore listings database (deduplication)
        uses: actions/cache@v4
        with:
          path: data/listings.db
          key: listings-db-${{ github.run_id }}
          restore-keys: |
            listings-db-

      - name: Ensure data directory exists
        run: mkdir -p data

      - name: Run rental scan
        env:
          SCRAPER_HEADLESS: 'true'
        run: python run_scrape_now.py
