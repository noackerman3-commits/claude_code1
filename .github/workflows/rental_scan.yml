name: Daily Rental Scan

on:
  schedule:
    # 11:00 UTC = 14:00 Israel Daylight Time (UTC+3, Apr–Oct)
    # In winter (UTC+2) this fires at 13:00 IL — adjust cron to "0 12 * * *" then
    - cron: '0 11 * * *'
  workflow_dispatch:  # allow manual runs

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install chromium --with-deps

      - name: Restore listings database
        uses: actions/cache@v4
        with:
          path: data/listings.db
          key: listings-db-${{ github.run_id }}
          restore-keys: |
            listings-db-

      - name: Create data directory
        run: mkdir -p data

      - name: Run rental scan
        run: python src/main.py
        env:
          PYTHONUNBUFFERED: '1'

      - name: Save listings database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/listings.db
          key: listings-db-${{ github.run_id }}
